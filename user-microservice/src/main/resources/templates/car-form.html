<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AUTOdeal - Car Form</title>
    <style>
        :root {
            --bg: #0a0814;
            --bg2: #120d22;
            --panel: rgba(26,18,50,0.96);
            --border: rgba(255,255,255,0.08);
            --text: #f8f7ff;
            --text-soft: #d8d0f0;
            --accent: #b99cff;
            --accent-hover: #a784ff;
            --shadow: 0 18px 44px rgba(0,0,0,0.32);
            --shadow-soft: 0 10px 26px rgba(0,0,0,0.20);
            --radius: 18px;
            --button-text: #140f25;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                    radial-gradient(circle at top left, rgba(139,92,246,0.18), transparent 24%),
                    linear-gradient(180deg, var(--bg), var(--bg2));
        }

        .navbar {
            background: rgba(9, 8, 20, 0.86);
            backdrop-filter: blur(10px);
            padding: 20px 42px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            color: white;
            transition: 0.18s ease;
        }

        .brand:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .brand-accent {
            color: var(--accent);
        }

        .container {
            width: 60%;
            margin: 34px auto;
            background: var(--panel);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 26px;
            font-size: 30px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(185,156,255,0.25);
            background-color: rgba(255,255,255,0.06);
            color: white;
            outline: none;
            font-family: inherit;
            transition: 0.18s ease;
        }

        input {
            padding-right: 14px;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image:
                    linear-gradient(rgba(255,255,255,0.06), rgba(255,255,255,0.06)),
                    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20' fill='none'><path d='M5 7.5L10 12.5L15 7.5' stroke='%23d7c8ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
            background-repeat: no-repeat, no-repeat;
            background-position: 0 0, right 14px center;
            background-size: auto, 18px;
            cursor: pointer;
        }

        input:focus,
        select:focus {
            border-color: rgba(139,92,246,0.9);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.16);
            background-color: rgba(255,255,255,0.08);
        }

        select:hover {
            border-color: rgba(185,156,255,0.4);
            background-color: rgba(255,255,255,0.08);
        }

        select option {
            background: #1b1431;
            color: #ffffff;
        }

        .btn {
            padding: 13px 24px;
            background: linear-gradient(180deg, var(--accent), var(--accent-hover));
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.18s ease;
            font-family: inherit;
            box-shadow: var(--shadow-soft);
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #cdbbff;
            font-weight: 700;
        }

        .back-link:hover {
            color: white;
        }

        .preview-image {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            display: block;
        }

        @media (max-width: 900px) {
            .container {
                width: 92%;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a class="brand" th:href="@{/}">
        AUTO<span class="brand-accent">deal</span>
    </a>
</div>

<div class="container">

    <a class="back-link" th:href="@{/cars}">← Back to Cars</a>

    <h1 th:text="${formTitle}">Car Form</h1>

    <form th:action="${isEdit} ? @{/cars/edit/{id}(id=${carPost.id})} : @{/cars/create}" method="post">

        <div class="form-group">
            <label>Brand</label>
            <select id="brandSelect" name="brandId" required>
                <option value="">Select brand</option>
                <option th:each="brand : ${brands}"
                        th:value="${brand.id}"
                        th:text="${brand.name}"
                        th:selected="${selectedBrandId != null and selectedBrandId == brand.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Model</label>
            <select id="modelSelect" name="modelId" required>
                <option value="">Select model</option>
                <option th:if="${isEdit}"
                        th:each="model : ${models}"
                        th:value="${model.id}"
                        th:text="${model.name}"
                        th:selected="${selectedModelId != null and selectedModelId == model.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Year</label>
            <input type="number" name="year" th:value="${isEdit ? carPost.year : ''}" required>
        </div>

        <div class="form-group">
            <label>Price (€)</label>
            <input type="number" name="price" th:value="${isEdit ? carPost.price : ''}" required>
        </div>

        <div class="form-group">
            <label>Mileage (km)</label>
            <input type="number" name="mileage" th:value="${isEdit ? carPost.mileage : ''}" required>
        </div>

        <div class="form-group">
            <label>Fuel Type</label>
            <select name="fuelType" required>
                <option value="">Select fuel type</option>
                <option th:each="fuel : ${fuelTypes}"
                        th:value="${fuel}"
                        th:text="${fuel}"
                        th:selected="${isEdit and carPost.fuelType == fuel}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Horsepower</label>
            <input type="number" name="horsepower" th:value="${isEdit ? carPost.horsepower : ''}" required>
        </div>

        <div class="form-group">
            <label>City</label>
            <input type="text" name="city" th:value="${isEdit ? carPost.city : ''}" required>
        </div>

        <div class="form-group">
            <label>Image URL</label>
            <input type="text"
                   id="imageUrlInput"
                   name="imageUrl"
                   placeholder="Paste direct image URL (optional)"
                   th:value="${isEdit ? carPost.imageUrl : ''}">

            <img id="imagePreview"
                 class="preview-image"
                 th:if="${isEdit and carPost.imageUrl != null and !carPost.imageUrl.isEmpty()}"
                 th:src="${carPost.imageUrl}"
                 alt="Image preview">
        </div>

        <button type="submit" class="btn">Save</button>
    </form>
</div>

<script th:inline="javascript">
    const brandSelect = document.getElementById("brandSelect");
    const modelSelect = document.getElementById("modelSelect");
    const selectedModelId = /*[[${selectedModelId}]]*/ null;
    const imageUrlInput = document.getElementById("imageUrlInput");
    let imagePreview = document.getElementById("imagePreview");

    brandSelect.addEventListener("change", function () {
        const brandId = this.value;

        modelSelect.innerHTML = '<option value="">Select model</option>';

        if (!brandId) {
            return;
        }

        fetch('/cars/models?brandId=' + brandId)
            .then(response => response.json())
            .then(models => {
                models.forEach(model => {
                    const option = document.createElement("option");
                    option.value = model.id;
                    option.textContent = model.name;

                    if (selectedModelId && model.id == selectedModelId) {
                        option.selected = true;
                    }

                    modelSelect.appendChild(option);
                });
            });
    });

    function updateImagePreview() {
        const url = imageUrlInput.value.trim();

        if (!imagePreview) {
            imagePreview = document.createElement("img");
            imagePreview.id = "imagePreview";
            imagePreview.className = "preview-image";
            imagePreview.alt = "Image preview";
            imageUrlInput.insertAdjacentElement("afterend", imagePreview);
        }

        if (url) {
            imagePreview.src = url;
            imagePreview.style.display = "block";
        } else if (imagePreview) {
            imagePreview.style.display = "none";
        }
    }

    imageUrlInput.addEventListener("input", updateImagePreview);

    if (imageUrlInput.value.trim()) {
        updateImagePreview();
    }
</script>

</body>
</html>
