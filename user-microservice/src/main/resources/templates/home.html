<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" >
<head>
    <meta charset="UTF-8">
    <title>AUTOdeal - Home</title>
    <style>
        :root {
            --bg: #0a0814;
            --bg2: #120d22;
            --bg3: #17112d;
            --panel: rgba(25, 18, 47, 0.72);
            --border: rgba(255,255,255,0.08);
            --text: #f8f7ff;
            --text-soft: #d8d0f0;
            --text-muted: #b2a7cf;
            --accent: #b99cff;
            --accent-hover: #a784ff;
            --shadow: 0 18px 44px rgba(0,0,0,0.32);
            --shadow-soft: 0 10px 26px rgba(0,0,0,0.20);
            --radius: 22px;
            --button-text: #140f25;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            color: var(--text);
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            background:
                    radial-gradient(circle at top left, rgba(139,92,246,0.18), transparent 24%),
                    radial-gradient(circle at top right, rgba(59,130,246,0.12), transparent 18%),
                    linear-gradient(180deg, var(--bg), var(--bg2) 45%, var(--bg3));
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(9, 8, 20, 0.86);
            backdrop-filter: blur(10px);
            color: white;
            padding: 20px 42px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 2px 18px rgba(0,0,0,0.12);
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: white;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .brand:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.05);
        }

        .brand-accent {
            color: var(--accent);
        }

        .hero-wrapper {
            width: 90%;
            max-width: 1240px;
            margin: 0 auto;
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0 60px 0;
        }

        .hero-card {
            width: 100%;
            max-width: 900px;
            text-align: center;
            background: var(--panel);
            border: 1px solid rgba(167, 139, 250, 0.16);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 56px 42px;
            backdrop-filter: blur(10px);
        }

        .hero-title {
            margin: 0 0 18px 0;
            font-size: 78px;
            line-height: 0.95;
            letter-spacing: -2.4px;
            font-weight: 900;
        }

        .hero-title .accent {
            color: var(--accent);
        }

        .hero-subtitle {
            margin: 0 auto 18px auto;
            max-width: 720px;
            font-size: 24px;
            line-height: 1.35;
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .hero-description {
            margin: 0 auto 34px auto;
            max-width: 690px;
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-soft);
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 800;
            transition: 0.18s ease;
            box-shadow: var(--shadow-soft);
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--accent), var(--accent-hover));
            color: var(--button-text);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: white;
            border: 1px solid rgba(185,156,255,0.22);
        }

        .btn-secondary:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.09);
            border-color: rgba(185,156,255,0.34);
        }

        .account-line {
            margin-top: 10px;
            font-size: 15px;
            color: var(--text-muted);
        }

        .account-line a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .account-line a:hover {
            color: white;
        }

        @media (max-width: 900px) {
            .hero-card {
                padding: 44px 24px;
            }

            .hero-title {
                font-size: 58px;
            }

            .hero-subtitle {
                font-size: 21px;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 20px;
            }

            .brand {
                font-size: 21px;
            }

            .hero-wrapper {
                width: 94%;
                padding: 24px 0 40px 0;
            }

            .hero-card {
                padding: 36px 18px;
            }

            .hero-title {
                font-size: 44px;
                line-height: 1;
            }

            .hero-subtitle {
                font-size: 18px;
            }

            .hero-description {
                font-size: 15px;
            }

            .hero-actions {
                flex-direction: column;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a class="brand" th:href="@{/}">
        AUTO<span class="brand-accent">deal</span>
    </a>
</div>

<div class="hero-wrapper">
    <div class="hero-card">
        <h1 class="hero-title">
            AUTO<span class="accent">deal</span>
        </h1>

        <p class="hero-subtitle">
            Find the right car, faster.
        </p>

        <p class="hero-description">
            Discover listings in a clean and modern marketplace built to make browsing,
            comparing, and posting cars simple and intuitive.
        </p>

        <div class="hero-actions">
            <a class="btn-primary" th:href="@{/cars}">View Cars</a>

            <a class="btn-secondary"
               th:href="@{/login}"
               sec:authorize="isAnonymous()">
                Sign In
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  sec:authorize="isAuthenticated()">
                <button type="submit" class="btn-secondary">Logout</button>
            </form>
        </div>

        <div class="account-line" sec:authorize="isAnonymous()">
            Don’t have an account?
            <a th:href="@{/register}">Create one</a>
        </div>
    </div>
</div>

</body>
</html>
