<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AUTOdeal - Edit Car</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <h1>AUTOdeal</h1>

    <div>
        <button onclick="setLanguage('en')">EN</button>
        <button onclick="setLanguage('ro')">RO</button>
    </div>

    <a href="index.html" data-i18n="home">Home</a>
    <a href="cars.html" data-i18n="cars">Cars</a>
    <a href="create-car.html">Create Car</a>
    <a href="login.html" data-i18n="login">Login</a>
    <a href="register.html" data-i18n="register">Register</a>
    <a href="chat.html" data-i18n="chat">Chat</a>
</nav>

<main>
    <h2>Edit Car Post</h2>

    <div id="message"></div>

    <p id="currentCarInfo" class="hint"></p>

    <form id="editCarForm" class="form-card">
        <label>Brand ID</label>
        <input type="number" id="brandId" required>

        <label>Model ID</label>
        <input type="number" id="modelId" required>

        <label>Year</label>
        <input type="number" id="year" required>

        <label>Price</label>
        <input type="number" id="price" required>

        <label>Mileage</label>
        <input type="number" id="mileage" required>

        <label>Fuel Type</label>
        <select id="fuelType" required>
            <option value="PETROL">PETROL</option>
            <option value="DIESEL">DIESEL</option>
            <option value="HYBRID">HYBRID</option>
            <option value="ELECTRIC">ELECTRIC</option>
        </select>

        <label>Horsepower</label>
        <input type="number" id="horsepower" required>

        <label>City</label>
        <input type="text" id="city" required>

        <label>Image URL</label>
        <input type="text" id="imageUrl">

        <button type="submit">Update Car</button>
    </form>
</main>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/navbar.js"></script>
<script src="js/edit-car.js"></script>

</body>
</html>
