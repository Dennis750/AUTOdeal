<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AUTOdeal - Create Car</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="logo-link">
    <span class="logo-auto">AUTO</span><span class="logo-deal">deal</span>
  </a>

  <div>
    <button onclick="setLanguage('en')">EN</button>
    <button onclick="setLanguage('ro')">RO</button>
  </div>

  <a href="index.html" data-i18n="home">Home</a>
  <a href="cars.html" data-i18n="cars">Cars</a>
  <a href="create-car.html">Create Car</a>
  <a href="login.html" data-i18n="login">Login</a>
  <a href="register.html" data-i18n="register">Register</a>
  <a href="chat.html" data-i18n="chat">Chat</a>
</nav>

<main>
  <section class="form-page-layout">
    <div class="form-page-intro">
      <p class="page-eyebrow">Seller dashboard</p>
      <h2>Create a new listing.</h2>
      <p>
        Add the main details of your car listing. Once published, the vehicle will appear on the public cars page.
      </p>

      <div class="form-note">
        <strong>Tip:</strong> Use the correct Brand ID and Model ID from your existing database records.
      </div>
    </div>

    <div class="form-page-card">
      <h2>Create Car Post</h2>

      <div id="message"></div>

      <form id="createCarForm" class="form-card luxury-form">
        <label>Brand</label>
        <select id="brandId" required>
          <option value="">Select brand</option>
        </select>

        <label>Model</label>
        <select id="modelId" required disabled>
          <option value="">Select model</option>
        </select>

        <label>Year</label>
        <input type="number" id="year" required>

        <label>Price</label>
        <input type="number" id="price" required>

        <label>Mileage</label>
        <input type="number" id="mileage" required>

        <label>Fuel Type</label>
        <select id="fuelType" required>
          <option value="PETROL">PETROL</option>
          <option value="DIESEL">DIESEL</option>
          <option value="HYBRID">HYBRID</option>
          <option value="ELECTRIC">ELECTRIC</option>
        </select>

        <label>Horsepower</label>
        <input type="number" id="horsepower" required>

        <label>City</label>
        <input type="text" id="city" required>

        <label>Image URL</label>
        <input type="text" id="imageUrl">

        <button type="submit">Create Car</button>
      </form>
    </div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/navbar.js"></script>
<script src="js/create-car.js"></script>

</body>
</html>
