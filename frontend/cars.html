<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AUTOdeal - Cars</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="logo-link">
        <span class="logo-auto">AUTO</span><span class="logo-deal">deal</span>
    </a>

    <div>
        <button onclick="setLanguage('en')">EN</button>
        <button onclick="setLanguage('ro')">RO</button>
    </div>

    <a href="index.html" data-i18n="home">Home</a>
    <a href="cars.html" data-i18n="cars">Cars</a>
    <a href="create-car.html">Create Car</a>
    <a href="login.html" data-i18n="login">Login</a>
    <a href="register.html" data-i18n="register">Register</a>
    <a href="chat.html" data-i18n="chat">Chat</a>
</nav>

<main>
    <section class="page-header page-header-split">
        <div>
            <p class="page-eyebrow">AUTOdeal inventory</p>
            <h2 class="page-title" data-i18n="availableCars">Available Cars</h2>
            <p class="page-description">
                Browse premium listings, filter by brand, model, price, year and fuel type, then log in to view seller contact details.
            </p>
        </div>

        <details id="exportButtons" class="export-panel">
            <summary>Export data</summary>

            <div class="export-menu">
                <button onclick="exportCars('json')" type="button">Export as JSON</button>
                <button onclick="exportCars('csv')" type="button">Export as CSV</button>
                <button onclick="exportCars('xml')" type="button">Export as XML</button>
            </div>
        </details>
    </section>

    <section class="filters">
        <select id="brandFilter">
            <option value="">All brands</option>
        </select>

        <select id="modelFilter" disabled>
            <option value="">All models</option>
        </select>

        <input type="number" id="minPrice" placeholder="Min price">
        <input type="number" id="maxPrice" placeholder="Max price">
        <input type="number" id="year" placeholder="Year">

        <select id="fuelType">
            <option value="">All fuel types</option>
            <option value="PETROL">Petrol</option>
            <option value="DIESEL">Diesel</option>
            <option value="HYBRID">Hybrid</option>
            <option value="ELECTRIC">Electric</option>
        </select>

        <select id="sortBy">
            <option value="">Default sorting</option>
            <option value="priceAsc">Price ascending</option>
            <option value="priceDesc">Price descending</option>
            <option value="yearAsc">Year ascending</option>
            <option value="yearDesc">Year descending</option>
            <option value="mileageAsc">Mileage ascending</option>
            <option value="mileageDesc">Mileage descending</option>
        </select>

        <button onclick="loadCars()">Apply filters</button>
        <button onclick="clearFilters()">Clear</button>
    </section>

    <div id="message"></div>

    <section id="carsContainer"></section>
</main>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/navbar.js"></script>
<script src="js/cars.js"></script>

</body>
</html>
