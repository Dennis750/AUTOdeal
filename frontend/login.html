<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AUTOdeal - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="logo-link">
        <span class="logo-auto">AUTO</span><span class="logo-deal">deal</span>
    </a>

    <div>
        <button onclick="setLanguage('en')">EN</button>
        <button onclick="setLanguage('ro')">RO</button>
    </div>

    <a href="index.html" data-i18n="home">Home</a>
    <a href="cars.html" data-i18n="cars">Cars</a>
    <a href="create-car.html">Create Car</a>
    <a href="login.html" data-i18n="login">Login</a>
    <a href="register.html" data-i18n="register">Register</a>
    <a href="chat.html" data-i18n="chat">Chat</a>
</nav>

<main>
    <section class="auth-layout">
        <div class="auth-intro">
            <p class="page-eyebrow">Member access</p>
            <h2>Welcome back.</h2>
            <p>
                Log in to view seller contact details, manage your car posts and access the full AUTOdeal experience.
            </p>
        </div>

        <div class="auth-card">
            <h2 data-i18n="login">Login</h2>

            <div id="message"></div>

            <form id="loginForm" class="form-card luxury-form">
                <label>Username</label>
                <input type="text" id="loginUsername" required>

                <label>Password</label>
                <input type="password" id="loginPassword" required>

                <button type="submit">Login</button>
            </form>

            <p class="auth-switch">
                Don’t have an account?
                <a href="register.html">Create one</a>
            </p>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/navbar.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
