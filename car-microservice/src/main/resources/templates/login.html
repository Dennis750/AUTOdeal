<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>AUTOdeal - Login</title>

    <style>
        :root {
            --bg: #0a0814;
            --bg2: #120d22;
            --panel: rgba(26,18,50,0.96);
            --border: rgba(255,255,255,0.08);
            --text: #f8f7ff;
            --text-soft: #d8d0f0;
            --accent: #b99cff;
            --accent-hover: #a784ff;
            --shadow: 0 18px 44px rgba(0,0,0,0.32);
            --shadow-soft: 0 10px 26px rgba(0,0,0,0.20);
            --radius: 18px;
            --button-text: #140f25;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                    radial-gradient(circle at top left, rgba(139,92,246,0.18), transparent 24%),
                    linear-gradient(180deg, var(--bg), var(--bg2));
        }


        .navbar {
            background: rgba(9, 8, 20, 0.86);
            backdrop-filter: blur(10px);
            padding: 20px 42px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            color: white;
            transition: 0.18s ease;
        }

        .brand:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .brand-accent {
            color: var(--accent);
        }


        .container {
            width: 420px;
            margin: 80px auto;
            background: var(--panel);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h1 {
            margin: 0 0 26px 0;
            text-align: center;
            font-size: 32px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(185,156,255,0.25);
            background: rgba(255,255,255,0.06);
            color: white;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: rgba(139,92,246,0.9);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.16);
        }


        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, var(--accent), var(--accent-hover));
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }


        .link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #cdbbff;
            text-decoration: none;
            font-weight: 700;
        }

        .link:hover {
            color: white;
        }


        .error {
            color: #fecaca;
            background: rgba(220,38,38,0.14);
            border: 1px solid rgba(220,38,38,0.35);
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 700;
        }

        .success {
            color: #bbf7d0;
            background: rgba(22,163,74,0.14);
            border: 1px solid rgba(22,163,74,0.35);
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 500px) {
            .container {
                width: 90%;
                margin: 40px auto;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a class="brand" th:href="@{/}">
        AUTO<span class="brand-accent">deal</span>
    </a>
</div>

<div class="container">
    <h1>Login</h1>

    <div th:if="${param.error}" class="error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="success">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <a th:href="@{/register}" class="link">No account? Register</a>
    <a th:href="@{/cars}" class="link">Back to Cars</a>
</div>

</body>
</html>
