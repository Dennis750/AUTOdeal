<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AUTOdeal - Register</title>

    <style>
        :root {
            --bg: #0a0814;
            --bg2: #120d22;
            --panel: rgba(26,18,50,0.96);
            --border: rgba(255,255,255,0.08);
            --text: #f8f7ff;
            --text-soft: #d8d0f0;
            --accent: #b99cff;
            --accent-hover: #a784ff;
            --shadow: 0 18px 44px rgba(0,0,0,0.32);
            --shadow-soft: 0 10px 26px rgba(0,0,0,0.20);
            --radius: 18px;
            --button-text: #140f25;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                    radial-gradient(circle at top left, rgba(139,92,246,0.18), transparent 24%),
                    linear-gradient(180deg, var(--bg), var(--bg2));
        }


        .navbar {
            background: rgba(9, 8, 20, 0.86);
            backdrop-filter: blur(10px);
            padding: 20px 42px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            color: white;
            transition: 0.18s ease;
        }

        .brand:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .brand-accent {
            color: var(--accent);
        }


        .container {
            width: 460px;
            margin: 70px auto;
            background: var(--panel);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h1 {
            margin: 0 0 26px 0;
            text-align: center;
            font-size: 30px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }


        input,
        select {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(185,156,255,0.25);
            background-color: rgba(255,255,255,0.06);
            color: white;
            outline: none;
            font-family: inherit;
            transition: 0.18s ease;
        }

        input {
            padding-right: 14px;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;

            background-image:
                    linear-gradient(rgba(255,255,255,0.06), rgba(255,255,255,0.06)),
                    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20' fill='none'><path d='M5 7.5L10 12.5L15 7.5' stroke='%23d7c8ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");

            background-repeat: no-repeat, no-repeat;
            background-position: 0 0, right 14px center;
            background-size: auto, 18px;

            cursor: pointer;
        }

        input:focus,
        select:focus {
            border-color: rgba(139,92,246,0.9);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.16);
            background-color: rgba(255,255,255,0.08);
        }

        select:hover {
            border-color: rgba(185,156,255,0.4);
            background-color: rgba(255,255,255,0.08);
        }

        select option {
            background: #1b1431;
            color: #ffffff;
        }

        select optgroup {
            background: #1b1431;
            color: #ffffff;
        }


        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, var(--accent), var(--accent-hover));
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }


        .link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #cdbbff;
            text-decoration: none;
            font-weight: 700;
        }

        .link:hover {
            color: white;
        }


        .error {
            color: #fecaca;
            background: rgba(220,38,38,0.14);
            border: 1px solid rgba(220,38,38,0.35);
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 500px) {
            .container {
                width: 92%;
                margin: 40px auto;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a class="brand" th:href="@{/}">
        AUTO<span class="brand-accent">deal</span>
    </a>
</div>

<div class="container">
    <h1>Create Account</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phoneNumber" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Role</label>
            <select name="role" required>
                <option value="">Select role</option>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirmPassword" required>
        </div>

        <button type="submit" class="btn">Create Account</button>
    </form>

    <a th:href="@{/login}" class="link">Already have an account? Login</a>
    <a th:href="@{/cars}" class="link">Back to Cars</a>
</div>

</body>
</html>
